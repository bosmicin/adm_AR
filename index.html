<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ultah — AR Edukasi</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"><\/script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"><\/script>
<style>*{box-sizing:border-box}body{margin:0;background:#10251b;color:#fff;font-family:system-ui,Arial,sans-serif}header{position:relative;z-index:3;background:#174d32;padding:14px 16px}h1{font-size:21px;margin:0 0 3px}.sub{font-size:13px}a-scene{position:fixed!important;inset:0;width:100vw;height:100dvh}.panel{position:fixed;z-index:10;bottom:12px;left:12px;right:12px;background:#fffffff2;color:#173323;padding:14px;border-radius:18px;box-shadow:0 4px 20px #0005}#status{font-weight:750;margin-bottom:5px}.hint{font-size:13px;line-height:1.4}button{border:0;border-radius:12px;background:#1e7548;color:white;padding:11px 14px;font-size:15px;font-weight:700;margin:9px 6px 0 0}button.alt{background:#e5f0e8;color:#174d32}</style></head>
<body><header><h1>📷 ultah</h1><div class="sub">Belajar Ceria • AR Edukasi</div></header><div class="panel"><div id="status">Siap memulai</div><div class="hint" id="hint">Tekan Mulai kamera, lalu arahkan ke gambar target.</div><button id="start">Mulai kamera</button><button class="alt" id="stop">Tutup kamera</button></div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes; maxTrack: 1" color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"><a-assets timeout="20000"><video id="mediaAsset" src="./konten.mp4" loop muted playsinline crossorigin="anonymous"></video></a-assets><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"><a-video id="content" src="#mediaAsset" width="1" height="1" position="0 0 0.02" material="shader: flat" visible="false"></a-video><a-text value="Happy Birthday Fania" color="#54e6a5" align="center" width="2.4" position="0 0.66 0.08" animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true"></a-text></a-entity></a-scene>
<script>const scene=document.querySelector('a-scene'),target=document.querySelector('#target'),content=document.querySelector('#content'),media=document.querySelector('#mediaAsset'),status=document.querySelector('#status'),hint=document.querySelector('#hint');let mindar=null;
scene.addEventListener('loaded',()=>{mindar=scene.systems['mindar-image-system'];target.addEventListener('targetFound',async()=>{content.setAttribute('visible',true);status.textContent='✅ Target terdeteksi!';hint.textContent='Konten dan teks AR muncul di atas target.';try{media.currentTime=0;await media.play()}catch(e){}});target.addEventListener('targetLost',()=>{content.setAttribute('visible',false);media.pause();status.textContent='Mencari target…';hint.textContent='Arahkan kamera ke seluruh gambar target dengan cahaya cukup.'})});
document.querySelector('#start').addEventListener('click',async()=>{try{if(!location.protocol.startsWith('http')){status.textContent='Perlu situs HTTPS';hint.textContent='Unggah ke GitHub Pages terlebih dahulu.';return}if(!mindar){await new Promise(r=>scene.addEventListener('loaded',r,{once:true}));mindar=scene.systems['mindar-image-system']}await mindar.start();status.textContent='Mencari target…'}catch(e){status.textContent='Kamera tidak bisa dimulai';hint.textContent='Periksa izin kamera, internet, dan HTTPS. '+(e.message||e)}});
document.querySelector('#stop').addEventListener('click',async()=>{try{if(mindar)await mindar.stop()}catch(e){}media.pause();content.setAttribute('visible',false);status.textContent='Kamera ditutup';hint.textContent='Tekan Mulai kamera untuk mencoba lagi.'});
<\/script></body></html>
