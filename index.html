<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ADM AR</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#17447e,#06152f 55%,#020712);font:16px/1.6 system-ui,sans-serif;color:white;text-align:center}.card{width:min(100%,560px);padding:28px 22px;border:1px solid #54d9ff66;border-radius:24px;background:#071831e8}.logo{width:min(300px,78vw);max-height:220px;object-fit:contain}h1{font-size:clamp(30px,7vw,42px);margin:6px 0}.tag{color:#72e8ff;font-weight:800}.muted{color:#d7eaff}.status{font-size:14px;color:#b9d5f6;margin-top:12px}</style></head><body><main class="card"><img class="logo" src="./logo-adm-ar.png" alt="ADM AR"><h1 id="h">ADM AR</h1><p class="tag">Augmented Reality Experience</p><p class="muted" id="m">AR edukasi dan ucapan personal.</p><p class="muted">Buka link ucapan yang diberikan lalu pindai kartu pada kado.</p><div id="s" class="status">Memeriksa link…</div></main><script>(async()=>{const p=new URLSearchParams(location.search),slug=(p.get('ucapan')||'').trim().toLowerCase(),s=document.getElementById('s');if(!slug){s.textContent='Untuk ucapan pribadi, gunakan link ?ucapan=nama.';return}try{const r=await fetch('./ucapan.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('ucapan.json belum diunggah di root');const d=await r.json(),i=d[slug];if(!i)throw Error('Ucapan '+slug+' belum ada dalam ucapan.json');const path=i.projectPath||((i.folder||'').replace(/\\/$/,'')+'/index.html');if(!path||path==='/index.html')throw Error('projectPath belum ada. Buat ulang proyek dengan tool ADM AR terbaru.');document.getElementById('h').textContent='Ucapan Spesial';s.textContent='Membuka kamera…';location.replace('./'+path.replace(/^\\/+/,''));}catch(e){s.textContent=e.message}})();<\/script></body></html>
