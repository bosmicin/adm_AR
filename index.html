<script>
(()=>{

 const status=(s)=>{};

 async function loadRemote(url){cleanupUrls();localMode=false;let u=new URL(url,location.href);baseUrl=u.href.substring(0,u.href.lastIndexOf('/')+1);status('Memuat project.json…');const r=await fetch(u.href,{cache:'no-store'});if(!r.ok)throw new Error('project.json tidak ditemukan (HTTP '+r.status+').');project=await r.json();if(!project||!Array.isArray(project.objects))throw new Error('Format project.json tidak dikenali.');mindUrl=new URL('targets.mind',baseUrl).href;await detectTargetAspect();await checkRemoteAssets();renderReady()}

 async function loadZip(file){

  const projectPath=Object.keys(zip.files).find(path=>!zip.files[path].dir&&/(^|\/)project\.json$/i.test(path));
  if(!projectPath)throw new Error('ZIP tidak berisi project.json.');
  const root=projectPath.slice(0,projectPath.lastIndexOf('/')+1);
  const pf=zip.file(projectPath);
  project=JSON.parse(await pf.async('text'));
  if(!project||!Array.isArray(project.objects))throw new Error('Format proyek tidak dikenali.');
  const mind=zip.file(root+'targets.mind')||zip.file(root+'targets/targets.mind');
  if(!mind)throw new Error('File targets.mind tidak ditemukan di dalam ZIP.');

  await detectTargetAspect(zip,root);

    if(entry.dir)continue;
    const rel=path.startsWith(root)?path.slice(root.length):path;
    if(rel.startsWith('assets/')||rel.startsWith('targets/')){

    if(o.fileName&&!['custom-text'].includes(o.type)&&!assetUrls.has(safeName(o.fileName)))

async function loadRemoteZip(url){

 async function detectTargetAspect(zip=null,zipRoot=''){

  if(window.AFRAME && !AFRAME.components['adm-tornado-orbit']){

   }

 }
 if(window.AFRAME && !AFRAME.components['adm-motion']){
  AFRAME.registerComponent('adm-motion',{
   schema:{kind:{type:'string',default:'none'},baseX:{type:'number',default:0},baseY:{type:'number',default:0},baseZ:{type:'number',default:0},baseRX:{type:'number',default:0},baseRY:{type:'number',default:0},baseRZ:{type:'number',default:0},baseSX:{type:'number',default:1},baseSY:{type:'number',default:1},baseSZ:{type:'number',default:1},phase:{type:'number',default:0},index:{type:'number',default:0}},
   tick:function(ms){const d=this.data,t=ms/1000,b=this.el.object3D,w=Math.sin;b.position.set(d.baseX,d.baseY,d.baseZ);b.rotation.set(d.baseRX,d.baseRY,d.baseRZ);b.scale.set(d.baseSX,d.baseSY,d.baseSZ);

     case 'sway':b.rotation.z+=w(t*2.4)*.42;b.rotation.y+=w(t*1.2)*.12;break;case 'pendulum':b.rotation.z+=w(t*1.8)*.78;break;

function addObject(parent,o){const p=vector(o.pos||o.position,[0,0,0]), r=vector(o.rot||o.rotation,[0,0,0]), s=vector(o.scale3,[o.scale||1,o.scale||1,o.scale||1]);let node;

  else if(type==='custom-audio'){const url=assetUrls.get(o.fileName);if(!url)return;const audio=el('audio',{'src':url,'preload':'auto','loop':'true'},document.body);audio.style.display='none';node=el('a-entity',{'position':p.join(' '),'rotation':r.map(x=>x*180/Math.PI).join(' '),'sound':'src: #'+(audio.id='adm-audio-'+Math.random().toString(36).slice(2))+'; autoplay: false; loop: true'},parent);node.addEventListener('targetFound',()=>audio.play().catch(()=>{}));node.addEventListener('targetLost',()=>audio.pause());}
  else if(type==='custom-text'){node=el('a-text',{'value':o.textValue||o.name||'Teks AR','color':o.color||'#ffffff','align':'center','side':'double','position':p.join(' '),'rotation':r.map(x=>x*180/Math.PI).join(' '),'scale':s.join(' ')},parent);}
  else {const map={sun:['a-sphere','#ffcc33'],earth:['a-sphere','#2f80ed'],mars:['a-sphere','#d65a45'],saturn:['a-sphere','#c9ad75'],cube:['a-box',o.color||'#7c5cff'],cylinder:['a-cylinder',o.color||'#7c5cff'],pyramid:['a-cone',o.color||'#7c5cff'],heart:['a-sphere','#e84b70'],brain:['a-sphere','#e8a3bd'],water_molecule:['a-sphere','#45a8ff'],plant_cell:['a-box','#61a96a'],dna:['a-torus-knot','#6f7dff'],hotspot:['a-sphere','#ffe066']};const def=map[type];if(!def)return;node=el(def[0],{'color':def[1],'position':p.join(' '),'rotation':r.map(x=>x*180/Math.PI).join(' '),'scale':s.join(' ')},parent);if(type==='saturn')el('a-torus',{'color':'#d8c69b','radius':'1.3','radius-tubular':'.08','rotation':'90 0 0'},node);}

 function buildScene(){const old=document.querySelector('#adm-ar-scene');if(old)old.parentNode.removeChild(old);const stage=$('ar-stage');const scene=el('a-scene',{'id':'adm-ar-scene','mindar-image':'imageTargetSrc: '+mindUrl+'; autoStart: true; uiLoading: no; uiError: no; uiScanning: no; maxTrack: 1','color-space':'sRGB','renderer':'colorManagement: true, physicallyCorrectLights: true','vr-mode-ui':'enabled: false','device-orientation-permission-ui':'enabled: false','embedded':'','loading-screen':'enabled: false'},stage);sceneEl=scene;el('a-assets',{},scene);el('a-camera',{'position':'0 0 0','look-controls':'enabled: false','wasd-controls-enabled':'false'},scene);const target=el('a-entity',{'mindar-image-target':'targetIndex: 0'},scene);project.objects.forEach(o=>addObject(target,o));scene.addEventListener('arReady',()=>{$('ar-hint').textContent='Kamera siap. Arahkan ke marker.'});scene.addEventListener('arError',()=>{$('ar-hint').textContent='Kamera tidak dapat dibuka. Periksa izin kamera dan koneksi HTTPS.'});target.addEventListener('targetFound',()=>{markerVisible=true;$('ar-hint').textContent=soundEnabled?'Marker terdeteksi! Video diputar dengan suara.':'Marker terdeteksi! Tekan tombol suara untuk mengaktifkan audio.';if(!userVideoPaused)document.querySelectorAll('video[id^="adm-video-"]').forEach(v=>{v.muted=(v.dataset.admAudioMode!=='original')||!soundEnabled;v.volume=1;const q=v.play();if(q&&q.catch)q.catch(()=>{});if(soundEnabled&&v.dataset.admExtraAudioId){const a=document.getElementById(v.dataset.admExtraAudioId);if(a&&!a.muted)a.play().catch(()=>{})}})});target.addEventListener('targetLost',()=>{markerVisible=false;document.querySelectorAll('video[id^="adm-video-"]').forEach(v=>v.pause());document.querySelectorAll('audio[id^="adm-extra-audio-"]').forEach(a=>a.pause());});target.addEventListener('targetLost',()=>{$('ar-hint').textContent='Marker belum terlihat. Arahkan kamera ke marker.'});}

 async function init(){

  const src=params.get('project');

    if(folder){
      if(!/^[a-zA-Z0-9_-]+$/.test(folder))throw new Error('Nama folder hanya boleh berisi huruf, angka, tanda hubung, dan garis bawah.');

    const message='Gagal memuat proyek atau membuka kamera: '+e.message+'\\nPeriksa tautan proyek, project.json, targets.mind, folder assets, serta izin kamera.';
    console.error(message,e);
    alert(message);
  }
}
$('ar-sound').addEventListener('click',async()=>{
 soundEnabled=!soundEnabled;
 $('ar-sound').textContent=soundEnabled?'✓ SUARA AKTIF (KETUK UNTUK MUTE)':'🔇 SUARA MUTE (KETUK UNTUK AKTIF)';
 $('ar-sound').classList.toggle('enabled',!soundEnabled);
 const videos=[...document.querySelectorAll('video[id^="adm-video-"]')];
 for(const v of videos){
  v.muted=!soundEnabled||(v.dataset.admAudioMode!=='original');v.volume=1;
  if(v.dataset.admExtraAudioId){const a=document.getElementById(v.dataset.admExtraAudioId);if(a){a.muted=!soundEnabled||a.dataset.admMuted==='true';if(!soundEnabled)a.pause();else if(markerVisible&&!userVideoPaused&&!a.muted){try{await a.play()}catch(e){}}}}
  if(soundEnabled&&markerVisible&&!userVideoPaused){try{await v.play()}catch(e){}}
 }
 $('ar-hint').textContent=soundEnabled?'Suara aktif. Ketuk tombol lagi untuk mute.':'Suara dimatikan. Video tetap berjalan tanpa suara.';
});
$('ar-video-pause').addEventListener('click',()=>{
 userVideoPaused=!userVideoPaused;
 const videos=[...document.querySelectorAll('video[id^="adm-video-"]')],audios=[...document.querySelectorAll('audio[id^="adm-extra-audio-"]')];
 if(userVideoPaused){videos.forEach(v=>v.pause());audios.forEach(a=>a.pause());$('ar-video-pause').textContent='▶ LANJUTKAN VIDEO';$('ar-video-pause').classList.add('paused');$('ar-hint').textContent='Video dijeda. Tekan LANJUTKAN VIDEO untuk melanjutkan.';}
 else{$('ar-video-pause').textContent='Ⅱ PAUSE VIDEO';$('ar-video-pause').classList.remove('paused');if(markerVisible){videos.forEach(v=>v.play().catch(()=>{}));if(soundEnabled)audios.forEach(a=>{if(!a.muted)a.play().catch(()=>{})});$('ar-hint').textContent='Video dilanjutkan.';}else $('ar-hint').textContent='Arahkan kamera ke marker.';}
});
$('ar-close').addEventListener('click',stopAR);
window.addEventListener('pagehide',()=>{try{stopAR();cleanupUrls()}catch(e){}});
init();
})();
</script>
