<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ADM AR Viewer</title>
<meta name="theme-color" content="#101827">
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--line:#293750;--accent:#7c5cff;--text:#f3f6ff;--muted:#aab6cc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{position:relative;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#101827;border-bottom:1px solid var(--line)}.logo{width:42px;height:42px;object-fit:contain;border-radius:12px;background:#fff1;padding:3px}.brand{font-weight:800;letter-spacing:.3px}.sub{font-size:12px;color:var(--muted)}main{max-width:800px;margin:auto;padding:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.title{font-size:22px;font-weight:800;margin:0 0 6px}.muted{color:var(--muted);font-size:14px;line-height:1.5}button,.filebtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 15px;background:var(--accent);color:white;font-weight:750;font-size:14px;cursor:pointer;text-decoration:none}button.secondary,.filebtn.secondary{background:#24324a;border:1px solid #3a4b67}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.field{display:block;width:100%;margin:8px 0 12px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b1424;color:white}.status{padding:12px;border-radius:12px;background:#0b1424;border:1px solid var(--line);font-size:13px;color:#dbe6ff;white-space:pre-wrap}.steps{padding-left:20px;color:var(--muted);line-height:1.7}#ar-stage{position:fixed;inset:0;background:#000;z-index:20;display:none}#ar-stage.active{display:block}#ar-stage a-scene{position:absolute!important;inset:0;width:100%;height:100%}.ar-top{position:absolute;z-index:40;left:12px;right:12px;top:12px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.ar-top>*{pointer-events:auto}.pill{background:#101827df;border:1px solid #ffffff2b;border-radius:99px;padding:9px 13px;font-size:12px;backdrop-filter:blur(8px)}#ar-close{background:#101827df;border:1px solid #ffffff2b;padding:10px 14px}#ar-hint{position:absolute;z-index:40;bottom:26px;left:50%;transform:translateX(-50%);max-width:90%;text-align:center;background:#101827df;border:1px solid #ffffff2b;border-radius:14px;padding:12px 16px;font-size:13px;backdrop-filter:blur(8px)}#busy{display:none;position:fixed;inset:0;z-index:60;background:#070b12ed;align-items:center;justify-content:center;padding:25px}#busy.show{display:flex}#busy img{display:block;width:clamp(110px,28vw,190px);height:auto;max-height:35vh;object-fit:contain;animation:logoPulse 1.6s ease-in-out infinite}@keyframes logoPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}.hidden{display:none!important}footer{text-align:center;color:#72819b;font-size:12px;padding:18px}
</style>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<div id="busy"><img src="adm-ar-logo-uploaded.png" alt="ADM AR"></div>
<div id="ar-stage"><div class="ar-top"><span class="pill" id="ar-label">ADM AR</span><button id="ar-close">✕ Tutup</button></div><div id="ar-hint">Arahkan kamera ke marker.</div></div>
<script>
(()=>{
 const $=id=>document.getElementById(id); let project=null, baseUrl='', mindUrl='', assetUrls=new Map(), objectUrls=[], localMode=false, sceneEl=null, started=false, targetAspect=1;
 const status=(s)=>{};
 const busy=(on)=>{$('busy').classList.toggle('show',on)};
 function safeName(s){return String(s||'').split('/').pop()}
 function guessMime(n){let e=(n.split('.').pop()||'').toLowerCase();return ({png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',mp4:'video/mp4',webm:'video/webm',mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',glb:'model/gltf-binary',gltf:'model/gltf+json'})[e]||'application/octet-stream'}
 function cleanupUrls(){objectUrls.forEach(URL.revokeObjectURL);objectUrls=[];assetUrls.clear()}
 async function loadRemote(url){cleanupUrls();localMode=false;let u=new URL(url,location.href);baseUrl=u.href.substring(0,u.href.lastIndexOf('/')+1);status('Memuat project.json…');const r=await fetch(u.href,{cache:'no-store'});if(!r.ok)throw new Error('project.json tidak ditemukan (HTTP '+r.status+').');project=await r.json();if(!project||!Array.isArray(project.objects))throw new Error('Format project.json tidak dikenali.');mindUrl=new URL('targets.mind',baseUrl).href;await detectTargetAspect();await checkRemoteAssets();renderReady()}
 async function checkRemoteAssets(){const missing=[];for(const o of project.objects){if(o.fileName&&!['custom-text'].includes(o.type)){const u=new URL('assets/'+encodeURIComponent(safeName(o.fileName)),baseUrl).href;try{const r=await fetch(u,{method:'HEAD'});if(r.ok)assetUrls.set(o.fileName,u);else missing.push(o.fileName)}catch{missing.push(o.fileName)}}}try{const r=await fetch(mindUrl,{method:'HEAD'});if(!r.ok)throw new Error()}catch{throw new Error('File targets.mind tidak ditemukan di folder yang sama dengan project.json.');}if(missing.length)throw new Error('Aset belum ditemukan di folder assets/: '+[...new Set(missing)].join(', '));}
 async function loadZip(file){
  cleanupUrls();localMode=true;
  const zip=await JSZip.loadAsync(file);
  const projectPath=Object.keys(zip.files).find(path=>!zip.files[path].dir&&/(^|\/)project\.json$/i.test(path));
  if(!projectPath)throw new Error('ZIP tidak berisi project.json.');
  const root=projectPath.slice(0,projectPath.lastIndexOf('/')+1);
  const pf=zip.file(projectPath);
  project=JSON.parse(await pf.async('text'));
  if(!project||!Array.isArray(project.objects))throw new Error('Format proyek tidak dikenali.');
  const mind=zip.file(root+'targets.mind')||zip.file(root+'targets/targets.mind');
  if(!mind)throw new Error('File targets.mind tidak ditemukan di dalam ZIP.');
  mindUrl=URL.createObjectURL(await mind.async('blob'));objectUrls.push(mindUrl);
  await detectTargetAspect(zip,root);
  for(const [path,entry] of Object.entries(zip.files)){
    if(entry.dir)continue;
    const rel=path.startsWith(root)?path.slice(root.length):path;
    if(rel.startsWith('assets/')||rel.startsWith('targets/')){
      const n=safeName(rel);
      const url=URL.createObjectURL(await entry.async('blob'));
      objectUrls.push(url);assetUrls.set(n,url);
    }
  }
  for(const o of project.objects){
    if(o.fileName&&!['custom-text'].includes(o.type)&&!assetUrls.has(safeName(o.fileName)))
      throw new Error('Aset '+o.fileName+' tidak ada di dalam ZIP.');
  }
  renderReady();
}
async function loadRemoteZip(url){
  cleanupUrls();
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw new Error('File ZIP tidak ditemukan: '+url+' (HTTP '+response.status+').');
  const blob=await response.blob();
  await loadZip(blob);
}
 async function detectTargetAspect(zip=null,zipRoot=''){
   targetAspect=1; const meta=project&&project.targetImage;
   if(meta&&Number(meta.width)>0&&Number(meta.height)>0){targetAspect=Number(meta.width)/Number(meta.height);return;}
   const name=meta&&safeName(meta.fileName||meta.name); if(!name)return;
   try{let url;if(zip){const entry=zip.file(zipRoot+'targets/'+name)||zip.file(zipRoot+name)||zip.file('targets/'+name)||zip.file(name);if(!entry)return;url=URL.createObjectURL(await entry.async('blob'));objectUrls.push(url);}else{url=new URL('targets/'+encodeURIComponent(name),baseUrl).href;}
   const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});if(img.naturalWidth&&img.naturalHeight)targetAspect=img.naturalWidth/img.naturalHeight;
   }catch(e){console.warn('Rasio target tidak dapat dibaca; memakai rasio default.',e);}
 }
 function renderReady(){$('ar-label').textContent=project.title||project.name||'ADM AR';}
 function el(tag,attrs={},parent){const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='text')n.textContent=v;else n.setAttribute(k,v)}if(parent)parent.appendChild(n);return n}
 function vector(v,fallback){return Array.isArray(v)?v:fallback}
 function addObject(parent,o){const p=vector(o.pos||o.position,[0,0,0]), r=vector(o.rot||o.rotation,[0,0,0]), s=vector(o.scale3,[o.scale||1,o.scale||1,o.scale||1]);let node;
  const type=o.type;
  if(type==='custom-model'){const url=assetUrls.get(o.fileName);if(!url)return;node=el('a-entity',{'gltf-model':'url('+url+')','position':p.join(' '),'rotation':r.map(x=>x*180/Math.PI).join(' '),'scale':s.join(' ')},parent);}
  else if(type==='custom-image'){const url=assetUrls.get(o.fileName);if(!url)return;node=el('a-image',{'src':url,'position':p.join(' '),'rotation':r.map(x=>x*180/Math.PI).join(' '),'width':Math.max(.1,s[0]||1),'height':Math.max(.1,s[1]||1)},parent);}
  else if(type==='custom-video'){const url=assetUrls.get(o.fileName);if(!url)return;const vid=el('video',{'src':url,'preload':'auto','loop':'true','muted':'true','playsinline':'true','webkit-playsinline':'true'},document.body);vid.style.display='none';const vId='adm-video-'+Math.random().toString(36).slice(2);vid.id=vId;vid.setAttribute('muted','');vid.muted=true;vid.loop=true;vid.playsInline=true;vid.setAttribute('playsinline','');vid.setAttribute('webkit-playsinline','');const scx=Number(s[0])||1,scy=Number(s[1])||1;node=el('a-video',{'src':'#'+vId,'position':p.join(' '),'rotation':r.map(x=>x*180/Math.PI).join(' '),'width':'1','height':'1'},parent);const fitVideo=()=>{const va=(vid.videoWidth||16)/(vid.videoHeight||9),ta=targetAspect||1;let w,h;if(va>=ta){w=1;h=1/va;}else{h=1/ta;w=h*va;}node.setAttribute('width',Math.max(.001,w*scx));node.setAttribute('height',Math.max(.001,h*scy));};vid.addEventListener('loadedmetadata',fitVideo,{once:true});vid.addEventListener('error',()=>{$('ar-hint').textContent='Video gagal dimuat. Periksa nama file dan folder assets.'});node.addEventListener('targetFound',()=>{vid.muted=true;const pr=vid.play();if(pr&&pr.catch)pr.catch(()=>{$('ar-hint').textContent='Marker terdeteksi. Ketuk layar sekali jika video belum mulai.'})});node.addEventListener('targetLost',()=>vid.pause());$('ar-stage').addEventListener('pointerdown',()=>{if(node.isConnected&&node.object3D.visible){vid.muted=true;vid.play().catch(()=>{})}},{passive:true});}
  else if(type==='custom-audio'){const url=assetUrls.get(o.fileName);if(!url)return;const audio=el('audio',{'src':url,'preload':'auto','loop':'true'},document.body);audio.style.display='none';node=el('a-entity',{'position':p.join(' '),'rotation':r.map(x=>x*180/Math.PI).join(' '),'sound':'src: #'+(audio.id='adm-audio-'+Math.random().toString(36).slice(2))+'; autoplay: false; loop: true'},parent);node.addEventListener('targetFound',()=>audio.play().catch(()=>{}));node.addEventListener('targetLost',()=>audio.pause());}
  else if(type==='custom-text'){node=el('a-text',{'value':o.textValue||o.name||'Teks AR','color':o.color||'#ffffff','align':'center','side':'double','position':p.join(' '),'rotation':r.map(x=>x*180/Math.PI).join(' '),'scale':s.join(' ')},parent);}
  else {const map={sun:['a-sphere','#ffcc33'],earth:['a-sphere','#2f80ed'],mars:['a-sphere','#d65a45'],saturn:['a-sphere','#c9ad75'],cube:['a-box',o.color||'#7c5cff'],cylinder:['a-cylinder',o.color||'#7c5cff'],pyramid:['a-cone',o.color||'#7c5cff'],heart:['a-sphere','#e84b70'],brain:['a-sphere','#e8a3bd'],water_molecule:['a-sphere','#45a8ff'],plant_cell:['a-box','#61a96a'],dna:['a-torus-knot','#6f7dff'],hotspot:['a-sphere','#ffe066']};const def=map[type];if(!def)return;node=el(def[0],{'color':def[1],'position':p.join(' '),'rotation':r.map(x=>x*180/Math.PI).join(' '),'scale':s.join(' ')},parent);if(type==='saturn')el('a-torus',{'color':'#d8c69b','radius':'1.3','radius-tubular':'.08','rotation':'90 0 0'},node);}
  if(node&&o.animation&&o.animation!=='none'){
   const anim=String(o.animation).toLowerCase();
   if(anim==='rotate'||anim==='spin'||anim==='rotation')node.setAttribute('animation','property: rotation; to: '+r[0]+' '+(r[1]+360)+' '+r[2]+'; loop: true; dur: 6000; easing: linear');
   else if(anim==='float'||anim==='updown'||anim==='hover')node.setAttribute('animation','property: position; dir: alternate; to: '+p[0]+' '+(p[1]+.18)+' '+p[2]+'; loop: true; dur: 1800; easing: easeInOutSine');
   else if(anim==='bounce'||anim==='bouncing')node.setAttribute('animation','property: position; dir: alternate; to: '+p[0]+' '+(p[1]+.22)+' '+p[2]+'; loop: true; dur: 650; easing: easeOutQuad');
   else if(anim==='pulse'||anim==='heartbeat')node.setAttribute('animation','property: scale; dir: alternate; to: '+(s[0]*1.15)+' '+(s[1]*1.15)+' '+(s[2]*1.15)+'; loop: true; dur: 700; easing: easeInOutSine');
   else if(anim==='fade')node.setAttribute('animation__fade','property: material.opacity; from: 1; to: .25; dir: alternate; loop: true; dur: 1000');
  }
 }
 function buildScene(){const old=document.querySelector('#adm-ar-scene');if(old)old.parentNode.removeChild(old);const stage=$('ar-stage');const scene=el('a-scene',{'id':'adm-ar-scene','mindar-image':'imageTargetSrc: '+mindUrl+'; autoStart: true; uiLoading: no; uiError: no; uiScanning: no; maxTrack: 1','color-space':'sRGB','renderer':'colorManagement: true, physicallyCorrectLights: true','vr-mode-ui':'enabled: false','device-orientation-permission-ui':'enabled: false','embedded':'','loading-screen':'enabled: false'},stage);sceneEl=scene;el('a-assets',{},scene);el('a-camera',{'position':'0 0 0','look-controls':'enabled: false','wasd-controls-enabled':'false'},scene);const target=el('a-entity',{'mindar-image-target':'targetIndex: 0'},scene);project.objects.forEach(o=>addObject(target,o));scene.addEventListener('arReady',()=>{$('ar-hint').textContent='Kamera siap. Arahkan ke marker.'});scene.addEventListener('arError',()=>{$('ar-hint').textContent='Kamera tidak dapat dibuka. Periksa izin kamera dan koneksi HTTPS.'});target.addEventListener('targetFound',()=>{$('ar-hint').textContent='Marker terdeteksi! Jika video belum mulai, ketuk layar sekali.';document.querySelectorAll('video[id^="adm-video-"]').forEach(v=>{v.muted=true;const q=v.play();if(q&&q.catch)q.catch(()=>{})})});target.addEventListener('targetLost',()=>document.querySelectorAll('video[id^="adm-video-"]').forEach(v=>v.pause()));target.addEventListener('targetLost',()=>{$('ar-hint').textContent='Marker belum terlihat. Arahkan kamera ke marker.'});}
 async function startAR(){if(!project)return;busy(true,'Memulai kamera AR…');try{$('ar-stage').classList.add('active');buildScene();await new Promise(r=>setTimeout(r,900));const scene=document.querySelector('#adm-ar-scene');if(scene&&scene.hasLoaded){busy(false)}else if(scene){scene.addEventListener('loaded',()=>busy(false),{once:true});setTimeout(()=>busy(false),5000)}started=true;}catch(e){busy(false);$('ar-stage').classList.remove('active');alert('Tidak bisa memulai AR: '+e.message)}}
 function stopAR(){const scene=document.querySelector('#adm-ar-scene');if(scene){try{const sys=scene.systems['mindar-image-system'];if(sys&&sys.stop)sys.stop()}catch(e){}scene.parentNode.removeChild(scene)}$('ar-stage').classList.remove('active');started=false;}
 async function init(){
  busy(true);
  const params=new URLSearchParams(location.search);
  const folder=(params.get('folder')||'').trim().replace(/^\/+|\/+$/g,'');
  const src=params.get('project');
  try{
    if(folder){
      if(!/^[a-zA-Z0-9_-]+$/.test(folder))throw new Error('Nama folder hanya boleh berisi huruf, angka, tanda hubung, dan garis bawah.');
      const zipName=/\.zip$/i.test(folder)?folder:folder+'.zip';
      await loadRemoteZip(zipName);
    }else if(src){
      await loadRemote(src);
    }else{
      await loadRemote('project.json');
    }
    await startAR();
  }catch(e){
    busy(false);
    const message='Gagal memuat proyek atau membuka kamera: '+e.message+'\\nPeriksa tautan proyek, project.json, targets.mind, folder assets, serta izin kamera.';
    console.error(message,e);
    alert(message);
  }
}
$('ar-close').addEventListener('click',stopAR);
window.addEventListener('pagehide',()=>{try{stopAR();cleanupUrls()}catch(e){}});
init();
})();
</script>
</body></html>
