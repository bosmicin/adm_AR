<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADM AR</title><style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#123d79 0%,#06152f 48%,#020712 100%);color:#fff;font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.box{width:min(100%,540px);padding:28px 22px 30px;border:1px solid #54d9ff55;border-radius:26px;background:linear-gradient(145deg,#0b2450d9,#06132ceF);box-shadow:0 18px 60px #0006}
.brand{width:min(330px,80vw);max-height:230px;object-fit:contain;display:block;margin:0 auto 8px;filter:drop-shadow(0 8px 18px #0007)}
h1{margin:4px 0 8px;font-size:clamp(30px,7vw,42px);line-height:1.1;letter-spacing:1px}
.tagline{color:#72e8ff;font-weight:750;margin:0 0 18px}
p{color:#d7eaff;line-height:1.7;margin:10px 0}
.pill{display:inline-block;margin-top:12px;padding:9px 14px;border:1px solid #55dfff88;border-radius:999px;background:#087bff24;color:#e8faff;font-size:13px;font-weight:700}
</style></head><body><main class="box">
<img class="brand" src="./logo-adm-ar.png" alt="Logo ADM AR">
<h1>ADM AR</h1>
<p class="tagline">Augmented Reality Experience</p>
<p>AR edukasi dan ucapan personal.</p>
<p>Buka link materi yang diberikan, lalu tekan <b>Mulai Scan AR</b> dan arahkan kamera ke gambar target.</p>
<p>Untuk ucapan personal, link memakai format <code>?ucapan=nama</code>.</p>
<div class="pill">SCAN • DISCOVER • CELEBRATE</div>
</main></body></html>
