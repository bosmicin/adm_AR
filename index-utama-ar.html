<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADM AR</title>
<style>body{margin:0;background:#f2f6fc;color:#182238;font:16px/1.5 system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 14px}.hero{padding:25px;border-radius:18px;background:linear-gradient(135deg,#1746a2,#5b8def);color:#fff}h1{margin:0 0 5px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px;margin-top:20px}.item{display:block;text-decoration:none;color:inherit;background:white;padding:17px;border:1px solid #dbe3ef;border-radius:14px;box-shadow:0 4px 14px #15274a0a}.item b{display:block;font-size:18px}.muted{color:#68758b;font-size:14px}</style></head><body><main class="wrap"><section class="hero"><h1>ADM AR</h1><div>Butuh Kado Unik, Hubungi WA . 08973977282</div></section><div id="cards" class="cards"><p>Memuat daftar materi…</p></div><p class="muted">Jika materi baru belum muncul, pastikan file materials.json sudah diperbarui dan halaman dimuat ulang.</p></main>
<script>
fetch('./materials.json?'+Date.now()).then(r=>{if(!r.ok)throw Error('materials.json belum tersedia');return r.json()}).then(items=>{const c=document.getElementById('cards');c.innerHTML='';if(!items.length){c.textContent='Belum ada materi. Tambahkan materi menggunakan AR Builder.';return}items.forEach(x=>{const a=document.createElement('a');a.className='item';a.href='./'+x.slug+'/';const b=document.createElement('b');b.textContent=x.title;const p=document.createElement('div');p.className='muted';p.textContent='Buka materi AR';a.append(b,p);c.appendChild(a)})}).catch(()=>{document.getElementById('cards').innerHTML='<p>Belum ada materials.json. Buat materi pertama dengan AR Builder lalu unggah file materials.json yang dihasilkan.</p>'});
</script></body></html>
