<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ULTAH</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif}#panel{position:fixed;z-index:5;left:10px;right:10px;bottom:16px;display:flex;justify-content:center;gap:8px;pointer-events:none}button{pointer-events:auto;border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:#185adb;color:white;box-shadow:0 3px 14px #0004}#tip{position:fixed;z-index:4;top:12px;left:10px;right:10px;text-align:center;background:#0009;color:white;padding:8px;border-radius:10px;font-size:14px}</style></head><body>
<div id="tip">Arahkan kamera ke gambar target: ULTAH</div><div id="panel"><button id="stop">Hentikan suara</button></div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-assets><video id="mediaAsset" src="./materi.mp4" preload="auto" loop="true" muted playsinline crossorigin="anonymous"></video></a-assets>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0"><a-video id="arMedia" src="#mediaAsset" width="1.2" height="0.675" position="0 0.1 0" rotation="0 0 0"></a-video><a-text value="Happy Birthday FANIA" align="center" color="#ff0000" width="3" position="0 0.85 0.03" animation="property: rotation; to: 0 360 0; dur: 3500; loop: true"></a-text></a-entity></a-scene>
<script>
const NARRATION="", MODE="off", RATE=1;
const target=document.getElementById('target'), media=document.getElementById('mediaAsset');
function speak(){if(!NARRATION.trim()||!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(NARRATION);u.lang='id-ID';u.rate=RATE;speechSynthesis.speak(u);}
target.addEventListener('targetFound',()=>{media.play().catch(()=>{}); if(MODE==='auto')speak();});
target.addEventListener('targetLost',()=>{media.pause(); if('speechSynthesis' in window)speechSynthesis.cancel();});
const sb=document.getElementById('speak');if(sb)sb.addEventListener('click',speak);
document.getElementById('stop').addEventListener('click',()=>{if('speechSynthesis' in window)speechSynthesis.cancel();});
</script></body></html>
