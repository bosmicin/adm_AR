
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR Ucapan Fania</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }
    #pesan {
      position: fixed;
      z-index: 1000;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 14px;
      border-radius: 12px;
      color: white;
      background: #071831ee;
      text-align: center;
      font-size: 15px;
    }
    #tombol {
      position: fixed;
      z-index: 1001;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
    }
    button {
      padding: 13px 17px;
      margin: 4px;
      border: 0;
      border-radius: 10px;
      background: #087bff;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="pesan">Memuat AR. Mohon tunggu...</div>

  <div id="tombol">
    <button id="mulai">Mulai Kamera AR</button>
    <button id="putar">Putar Video</button>
  </div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="video"
        src="./materi.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        loop
        muted>
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <a-video
        src="#video"
        width="1.2"
        height="0.675"
        position="0 0.1 0">
      </a-video>

      <a-text
        value="Happy Birthday Fania"
        align="center"
        color="#ff4040"
        width="3"
        position="0 0.85 0.03">
      </a-text>

    </a-entity>
  </a-scene>

  <script>
    const pesan = document.getElementById("pesan");
    const scene = document.getElementById("scene");
    const target = document.getElementById("target");
    const video = document.getElementById("video");

    scene.addEventListener("loaded", function () {
      pesan.textContent = "Halaman siap. Menyiapkan kamera...";
    });

    scene.addEventListener("arReady", function () {
      pesan.textContent = "Kamera aktif! Arahkan ke kartu Fania.";
    });

    scene.addEventListener("arError", function () {
      pesan.textContent =
        "Kamera gagal dimulai. Periksa izin kamera dan muat ulang halaman.";
    });

    target.addEventListener("targetFound", function () {
      pesan.textContent = "Kartu terdeteksi! Selamat ulang tahun! 🎉";
      video.play().catch(function () {
        pesan.textContent =
          "Kartu terdeteksi. Tekan tombol Putar Video.";
      });
    });

    target.addEventListener("targetLost", function () {
      video.pause();
      pesan.textContent = "Arahkan kamera ke kartu Fania.";
    });

    document.getElementById("mulai").addEventListener("click", async function () {
      pesan.textContent = "Mencoba mengaktifkan kamera...";
      try {
        const sistem = scene.systems["mindar-image-system"];
        if (sistem && sistem.start) {
          await sistem.start();
        } else {
          pesan.textContent =
            "Sistem AR belum siap. Muat ulang halaman dan coba lagi.";
        }
      } catch (error) {
        pesan.textContent =
          "Gagal memulai kamera: " + error.message;
      }
    });

    document.getElementById("putar").addEventListener("click", function () {
      video.play().then(function () {
        pesan.textContent = "Video sedang diputar.";
      }).catch(function () {
        pesan.textContent =
          "Video tidak dapat diputar. Periksa file materi.mp4.";
      });
    });

    window.addEventListener("error", function (event) {
      pesan.textContent = "Kesalahan halaman: " + event.message;
    });
  </script>
</body>
</html>
