<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>fania</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"><\/script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"><\/script><style>body{margin:0;font-family:system-ui}#tip{position:fixed;z-index:5;top:10px;left:10px;right:10px;background:#06152fe8;color:white;text-align:center;padding:11px;border-radius:12px}#controls{position:fixed;z-index:6;bottom:14px;left:0;right:0;text-align:center}button{padding:12px;border:0;border-radius:12px;background:#087bff;color:white;font-weight:bold;margin:3px}</style></head><body><div id="tip">Arahkan kamera ke kartu target.</div><div id="controls"><button id="play">▶ Putar ulang</button><button id="voice">🔊 Dengarkan narasi</button><button id="stop">Hentikan</button></div><a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: yes; uiError: no;" color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"><a-assets><video id="media" src="./materi.mp4" playsinline preload="auto" loop muted></video></a-assets><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"><a-video src="#media" width="1.2" height="0.675" position="0 0.1 0"></a-video><a-text value="Happy Birthday Fania" align="center" color="#ff0000" width="3" position="0 0.85 0.03" animation="property: rotation; to: 0 360 0; dur: 3500; loop: true"></a-text></a-entity></a-scene><script>const n="",m="auto",rate=1,v=document.getElementById('media'),t=document.getElementById('target'),tip=document.getElementById('tip');function say(){if(n&&m!=='off'&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(n);u.lang='id-ID';u.rate=rate;speechSynthesis.speak(u)}}t.addEventListener('targetFound',()=>{tip.textContent='Target terdeteksi! 🎉';v.play().catch(()=>{});if(m==='auto')say()});t.addEventListener('targetLost',()=>{v.pause();if('speechSynthesis'in window)speechSynthesis.cancel();tip.textContent='Arahkan kamera ke kartu target.'});document.getElementById('play').onclick=()=>{v.currentTime=0;v.play().catch(()=>{});;document.getElementById('voice').onclick=say;document.getElementById('stop').onclick=()=>{v.pause();if('speechSynthesis'in window)speechSynthesis.cancel()};<\/script></body></html>
